<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c43">
  <title>配對大作戰｜在海邊躍動的精靈</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="pair-game.css">
  <script src="assets/games/matching/image-map.js"></script>
  <link rel="stylesheet" href="mobile-layout.css">
</head>
<body class="pair-page">
  <main class="pair-game">
    <div class="pair-atmosphere" aria-hidden="true"></div>
    <header class="pair-toolbar">
      <div class="pair-heading">
        <p>COASTAL BIRDS · MEMORY</p>
        <h1>配對大作戰</h1>
      </div>
      <section class="pair-hud" aria-label="遊戲狀態">
        <div class="hud-time"><span>剩餘時間</span><output id="timer">02:00</output></div>
        <div><span>配對完成</span><strong><output id="matches">0</output><i>/</i><output id="total">12</output></strong></div>
        <div><span>翻牌次數</span><strong><output id="flips">0</output></strong></div>
      </section>
      <div class="pair-actions">
        <button class="pause-button" id="pause" type="button" aria-pressed="false" hidden>休息一下</button>
        <button class="reset-button" id="reset" type="button" hidden>重新開始 ↻</button>
        <a class="pair-back" href="game.html">← 返回遊戲選單</a>
      </div>
    </header>

    <div class="round-progress" aria-hidden="true"><span id="time-progress"></span></div>
    <section class="pair-board" id="board" aria-label="海鳥記憶配對卡片" hidden></section>

    <section class="pair-overlay" id="welcome" aria-labelledby="welcome-title">
      <div class="pair-dialog welcome-dialog">
        <p class="dialog-kicker">FIND THE BIRDS · BEAT THE CLOCK</p>
        <h2 id="welcome-title">翻開卡片，找出相同的鳥兒</h2>
        <p>記住每張照片的位置，找齊所有成對的海岸鳥。越少翻牌、越快完成，紀錄越漂亮。</p>
        <div class="difficulty-picker" role="group" aria-label="選擇挑戰難度">
          <button type="button" data-pairs="6"><span>輕鬆漫遊</span><small>6 對 · 1 分鐘</small></button>
          <button type="button" data-pairs="8"><span>海岸觀察</span><small>8 對 · 1 分 30 秒</small></button>
          <button class="is-active" type="button" data-pairs="12"><span>潮間挑戰</span><small>12 對 · 2 分鐘</small></button>
        </div>
        <button class="primary-button" id="begin" type="button">開始配對 <span>→</span></button>
      </div>
    </section>

    <section class="pair-overlay" id="pause-panel" aria-labelledby="pause-title" hidden>
      <div class="pair-dialog pause-dialog">
        <p class="dialog-kicker">TAKE A BREATH</p>
        <h2 id="pause-title">休息一下</h2>
        <p>卡片已暫停，準備好了再繼續。</p>
        <button class="primary-button" id="resume" type="button">繼續配對 <span>→</span></button>
      </div>
    </section>

    <section class="pair-overlay" id="results" aria-labelledby="result-title" hidden>
      <div class="pair-dialog result-dialog">
        <p class="dialog-kicker">MEMORY COMPLETE</p>
        <h2 id="result-title">配對完成</h2>
        <p class="result-score"><output id="result-matches">12</output><span>對</span></p>
        <p id="result-copy"></p>
        <div class="result-actions">
          <button class="primary-button" id="again" type="button">再玩一次 <span>↻</span></button>
          <a class="quiet-button" href="game.html">返回遊戲選單</a>
        </div>
      </div>
    </section>
  </main>
  <script src="card.js"></script>
  <script src="background-music.js"></script>
</body>
</html>
