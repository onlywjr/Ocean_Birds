<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猜猜我是誰</title><link rel="stylesheet" href="section.css"><style>
.section-stage{height:auto;min-height:100vh;aspect-ratio:auto;overflow:visible}.welcome,.puzzle{max-width:850px;margin:110px auto 24px;padding:28px;background:#edf4f1ef;border-radius:18px;color:#164665}.welcome{text-align:center}.welcome p,.puzzle p{font-size:18px;line-height:1.65}.welcome button,.puzzle .action{padding:10px 24px;background:#e4a94d;border:0;border-radius:8px;font-size:19px;font-weight:bold;cursor:pointer}.puzzle[hidden],.welcome[hidden]{display:none}.slots,.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.slot{min-height:180px;border:2px dashed #5994a2;border-radius:12px;padding:8px;text-align:center}.slot img,.choices img{width:100%;height:120px;object-fit:cover;border-radius:8px}.slot .drop{margin-top:8px}.choices{margin-top:18px}.choices button{cursor:grab;background:#fff;border:1px solid #abc;border-radius:10px;padding:6px}.choices button.selected{outline:4px solid #e6ae51}.choices button:disabled{opacity:.65;cursor:default}
@media(max-width:620px){.slots,.choices{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="section-stage"><header class="section-heading"><h1>猜猜我是誰</h1></header><a class="home-button" href="game.html">回選單</a>
<section class="welcome" id="welcome"><p>一年一度的水鳥度度大會開始了，大家本來都坐在自己的位子上，沒想到剛剛一陣大地震，大家都離開了原本的位置逃難去了。現在地震結束了，為了避免造成混亂，還得靠聰明的你幫忙，安排鳥兒回到正確的位置上。遊戲共有五關，鳥兒數量會逐關增加。</p><button id="begin">開始</button></section>
<section class="puzzle" id="puzzle" hidden><p id="level-title">鳥類初學者</p><div class="stats">關卡 <b id="level">1</b> / 5　配對完成 <b id="matches">0</b> / <b id="total">4</b></div><div class="slots" id="slots"></div><div class="choices" id="choices"></div><p id="message" aria-live="polite">拖曳鳥類照片到相同名稱的位置；也可以先點照片，再點位置。</p><button class="action" id="reset">重新排列</button><button class="action" id="next-level" hidden>下一關</button></section></main>
<script>
const birds=[['白鶺鴒',74],['翠鳥',72],['黑脊鷗',70],['鳳頭燕鷗',68],['黑嘴鷗',66],['小燕鷗',64],['翻石鷸',62],['磯鷸',60],['紅胸濱鷸',58],['半蹼鷸',56],['中杓鷸',54],['小青足鷸',52],['灰斑鴴',50],['鐵嘴鴴',48],['金斑鴴',46],['東方環頸鴴',44],['小環頸鴴',42],['彩鷸',40],['魚鷹',38],['黑鳶',36],['岩鷺',34],['蒼鷺',32],['小白鷺',30],['大白鷺',27],['白腹鰹鳥',25]],sizes=[4,6,8,10,12],ranks=['鳥類初學者','鳥類觀察家','鳥專家','鳥博士','鳥神'],slots=document.querySelector('#slots'),choices=document.querySelector('#choices'),welcome=document.querySelector('#welcome'),puzzle=document.querySelector('#puzzle');let level=0,round=[],selected=null,solved=0;
function place(name,slot){if(!selected||slot.querySelector('.drop').children.length)return;if(name===slot.dataset.name){slot.querySelector('.drop').append(selected);selected.disabled=true;selected.classList.remove('selected');solved++;document.querySelector('#matches').textContent=solved;document.querySelector('#message').textContent=solved===round.length?'這一關完成！可以前往下一關。':'答對了！再幫下一隻鳥找位置。';if(solved===round.length)document.querySelector('#next-level').hidden=false}else{document.querySelector('#message').textContent='位置不對，再試一次。';selected.classList.remove('selected')}selected=null}
function reset(){round=[...birds].sort(()=>Math.random()-.5).slice(0,sizes[level]);solved=0;selected=null;document.querySelector('#level').textContent=level+1;document.querySelector('#level-title').textContent=ranks[level];document.querySelector('#matches').textContent='0';document.querySelector('#total').textContent=round.length;document.querySelector('#next-level').hidden=true;document.querySelector('#message').textContent='拖曳鳥類照片到相同名稱的位置；也可以先點照片，再點位置。';slots.innerHTML=round.map(([name])=>`<div class="slot" data-name="${name}"><strong>${name}</strong><div class="drop"></div></div>`).join('');choices.innerHTML=[...round].sort(()=>Math.random()-.5).map(([name,id],i)=>`<button draggable="true" data-name="${name}" type="button" aria-label="第 ${i+1} 張鳥類照片"><img src="assets/decoded/guess/bitmap_${id}.jpg" alt="待配對鳥類照片"></button>`).join('');choices.querySelectorAll('button').forEach(button=>{button.ondragstart=event=>{event.dataTransfer.setData('text/plain',button.dataset.name);select(button)};button.onclick=()=>select(button)});slots.querySelectorAll('.slot').forEach(slot=>{slot.ondragover=event=>event.preventDefault();slot.ondrop=event=>{event.preventDefault();if(!selected)select([...choices.children].find(button=>button.dataset.name===event.dataTransfer.getData('text/plain')));place(event.dataTransfer.getData('text/plain'),slot)};slot.onclick=()=>selected&&place(selected.dataset.name,slot)})}
function select(button){if(!button||button.disabled)return;choices.querySelectorAll('button').forEach(item=>item.classList.remove('selected'));selected=button;selected.classList.add('selected')}
document.querySelector('#begin').onclick=()=>{welcome.hidden=true;puzzle.hidden=false;level=0;reset()};document.querySelector('#reset').onclick=reset;document.querySelector('#next-level').onclick=()=>{if(level===sizes.length-1){document.querySelector('#level-title').textContent='鳥神';document.querySelector('#message').textContent='恭喜完成所有五關！';slots.replaceChildren();choices.replaceChildren();document.querySelector('#next-level').hidden=true;return}level++;reset()};
</script></body></html>
