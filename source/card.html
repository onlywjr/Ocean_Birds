<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

<head>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<title>在海邊躍動的精靈</title>

<style type="text/css">

body {
	background-color: #255f8a;	
	margin-top: -5px;
    overflow: hidden;
}

</style>

</head>

<body>

<div class="allDiv" id="all">
 
    <embed id="embedFlash" src="card.swf" type="application/x-shockwave-flash" wmode="transparent" />
 
</div>

<!--選擇解析度-->

<script type="text/javascript">

var objWidth=900;
var objHeight=600;
var scaleRate=1;

var targetWidth=document.documentElement.clientWidth;
var targetHeight=document.documentElement.clientHeight;
var targetStyle=document.getElementById('embedFlash').style;

var allDivStyle=document.getElementById('all').style;

if(targetWidth > objWidth && targetHeight > objHeight){

    scaleRate=Math.round(Math.min(targetWidth/objWidth, targetHeight/objHeight)*100)/100+0.01;   

}

targetStyle.width=objWidth*scaleRate + "px";
targetStyle.height=objHeight*scaleRate + "px";

allDivStyle.width=objWidth*scaleRate + "px";
allDivStyle.height=objHeight*scaleRate + "px";
allDivStyle.marginLeft = "auto";
allDivStyle.marginRight = "auto";

</script>

</body>

</html>
