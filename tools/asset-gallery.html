<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主 SWF 圖片索引</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#183d5b;color:#fff;font:16px sans-serif}header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:10px;background:#183d5b}#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.tile{min-width:0;padding:6px;border:1px solid #8aa5b8;background:#244e6d;text-align:center}.tile img{display:block;width:100%;height:105px;object-fit:contain;background:#173850}.tile small{display:block;padding-top:4px}button{padding:7px 12px}@media(max-width:700px){#grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
<header><b>主 SWF 圖片索引</b><span id="pager"></span><button id="prev">上一批</button><button id="next">下一批</button></header><main id="grid"></main>
<script src="../bitmaps.js"></script><script>
const size=36,grid=document.querySelector('#grid'),pageLabel=document.querySelector('#pager'),params=new URLSearchParams(location.search);let page=Math.max(0,Number(params.get('page'))||0);function draw(){const ids=window.BITMAPS.ids;grid.innerHTML=ids.slice(page*size,(page+1)*size).map(id=>`<div class="tile"><img loading="lazy" src="../assets/decoded/bitmap_${id}.jpg"><small>bitmap_${id}</small></div>`).join('');pageLabel.textContent=`${page*size+1}–${Math.min((page+1)*size,ids.length)} / ${ids.length}`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=(page+1)*size>=ids.length}function move(n){page+=n;history.replaceState(null,'',`?page=${page}`);draw()}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);draw();
</script></html>
