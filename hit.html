<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小白鷺找食物｜在海邊躍動的精靈</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="food-game.css">
  <script src="assets/games/food-search/image-map.js"></script>
  <link rel="stylesheet" href="mobile-layout.css">
</head>
<body class="food-page">
  <main class="food-game">
    <canvas id="shore" tabindex="0" aria-label="移動滑鼠或手指，帶領小白鷺尋找食物"></canvas>
    <div class="shore-wash" aria-hidden="true"></div>
    <a class="food-back" href="game.html">← 返回遊戲選單</a>

    <header class="food-header">
      <p class="food-brand">COASTAL BIRDS <span>·</span> FIELD PLAY</p>
      <h1>小白鷺找食物</h1>
      <p class="food-subtitle">跟著潮汐覓食，替海岸避開垃圾</p>
    </header>

    <section class="food-hud" aria-label="遊戲狀態">
      <div class="hud-item hud-time"><span>剩餘時間</span><output id="time">01:00</output></div>
      <div class="hud-item hud-score"><span>覓食得分</span><output id="score">0</output></div>
    </section>

    <div class="food-feedback" id="feedback" role="status" aria-live="polite" hidden></div>
    <p class="food-tip" id="food-tip">目標會隨機冒出，快帶小白鷺追上牠們</p>

    <section class="food-overlay" id="welcome" aria-labelledby="welcome-title">
      <div class="food-dialog">
        <p class="dialog-eyebrow">60 SECONDS · COASTAL MISSION</p>
        <h2 id="welcome-title">潮間帶覓食任務</h2>
        <p class="dialog-copy">小白鷺會跟著你的滑鼠移動。魚蝦和垃圾會在潮間帶隨機冒出，短暫停留後消失；把握時間覓食，也要小心別吃到垃圾。</p>
        <div class="score-guide">
          <span><i class="guide-dot is-food"></i>魚蝦 <b>+10</b></span>
          <span><i class="guide-dot is-trash"></i>垃圾 <b>−8</b></span>
        </div>
        <button class="start-button" id="start" type="button">開始覓食 <span>→</span></button>
        <p class="dialog-note">一分鐘後看看，你能替海岸找回多少活力。</p>
      </div>
    </section>

    <section class="food-overlay" id="results" aria-labelledby="result-title" hidden>
      <div class="food-dialog result-dialog">
        <p class="dialog-eyebrow">MISSION COMPLETE</p>
        <h2 id="result-title">覓食時間結束</h2>
        <p class="result-score"><output id="final-score">0</output><span>分</span></p>
        <p id="result-copy" class="dialog-copy"></p>
        <div class="result-actions">
          <button class="start-button" id="again" type="button">再玩一次 <span>↻</span></button>
          <a class="food-back result-back" href="game.html">返回遊戲選單</a>
        </div>
      </div>
    </section>
  </main>
  <script src="hit.js"></script>
  <script src="background-music.js"></script>
</body>
</html>
