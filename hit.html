<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小白鷺找食物</title><link rel="stylesheet" href="section.css"><style>
.section-stage{width:min(100vw,150svh,900px);height:auto;min-height:0;aspect-ratio:3/2;overflow:hidden}.play{width:88.8%;margin:10cqw auto 0;padding:1.5cqw;background:#e6f2f0ef;border-radius:1.7cqw;text-align:center;color:#164665}.play>p{margin:.6cqw 0;font-size:2.1cqw}.play button{padding:.9cqw 2cqw;margin:.3cqw;border:0;border-radius:.9cqw;background:#e4a94d;color:#352814;font-size:2.3cqw;font-weight:bold;cursor:pointer}.stats{display:flex;justify-content:center;gap:3.5cqw;font-size:2.5cqw;font-weight:bold}#shore{display:block;width:min(100%,70cqw);height:auto;margin:auto;border:.8cqw solid white;border-radius:1.2cqw;cursor:crosshair;touch-action:manipulation}
</style></head>
<body><main class="section-stage"><header class="section-heading"><h1>小白鷺找食物</h1></header><a class="home-button" href="game.html">回選單</a>
<section class="play"><p>小白鷺來到海岸找食物，卻遇上垃圾與危險。聰明的你快來幫幫小白鷺吧！（吃錯了可是會扣分的唷）</p><div class="stats"><span>時間 <b id="time">60</b></span><span>分數 <b id="score">0</b></span></div><canvas id="shore" width="680" height="300" aria-label="海岸覓食遊戲場景"></canvas><div><button id="start">開始</button><button id="again">重新開始</button></div><p id="message" aria-live="polite">按「開始」進入海岸覓食。</p></section></main>
<script>
const canvas=document.querySelector('#shore'),ctx=canvas.getContext('2d'),time=document.querySelector('#time'),score=document.querySelector('#score'),message=document.querySelector('#message');
const loadImage=src=>{const image=new Image();image.src=src;return image};
const background=loadImage('assets/decoded/hit/bitmap_7.jpg'),egret=[loadImage('assets/decoded/hit/lossless_20.png'),loadImage('assets/decoded/hit/lossless_22.png')];
const objects=[{src:'lossless_27.png',food:true},{src:'lossless_32.png',food:true},{src:'lossless_36.png',food:true},{src:'lossless_46.png',food:false},{src:'lossless_51.png',food:false},{src:'lossless_55.png',food:false}].map(x=>({...x,image:loadImage(`assets/decoded/hit/${x.src}`)}));
let left=60,points=0,timer=null,targets=[],playing=false,raf=0,walk=0,step=0;
function spawn(){const pool=[...objects].sort(()=>Math.random()-.5).slice(0,5);targets=pool.map(item=>({item,x:40+Math.random()*600,y:48+Math.random()*164,w:item.food?56:38,h:item.food?44:48,phase:Math.random()*6.28}))}
function paint(){ctx.clearRect(0,0,680,300);ctx.fillStyle='#b8d0c4';ctx.fillRect(0,0,680,300);if(background.complete&&background.naturalWidth)ctx.drawImage(background,0,0,680,300);targets.forEach(t=>{const bob=Math.sin(step/13+t.phase)*3;if(t.item.image.complete&&t.item.image.naturalWidth)ctx.drawImage(t.item.image,t.x-t.w/2,t.y-t.h/2+bob,t.w,t.h)});if(playing){walk=(walk+1.15)%780;const bird=egret[Math.floor(step/8)%2];if(bird.complete&&bird.naturalWidth)ctx.drawImage(bird,walk-45,205,70,84);step++;raf=requestAnimationFrame(paint)}}
function start(){clearInterval(timer);cancelAnimationFrame(raf);left=60;points=0;walk=0;step=0;playing=true;time.textContent=left;score.textContent=points;message.textContent='幫小白鷺找到食物，避開海岸垃圾！';spawn();paint();timer=setInterval(()=>{time.textContent=--left;if(left<=0){clearInterval(timer);timer=null;playing=false;cancelAnimationFrame(raf);paint();message.textContent=`時間到！本次得分：${points}`}},1000)}
document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;
canvas.addEventListener('click',event=>{if(!playing)return;const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*680/rect.width,y=(event.clientY-rect.top)*300/rect.height,index=targets.findIndex(t=>Math.abs(t.x-x)<t.w*.62&&Math.abs(t.y-y)<t.h*.65);if(index<0)return;const [target]=targets.splice(index,1);points+=target.item.food?10:-5;score.textContent=points;message.textContent=target.item.food?'找到食物了！':'哎呀，吃到垃圾了，扣分。';setTimeout(()=>{if(playing){const item=objects[Math.floor(Math.random()*objects.length)];targets.push({item,x:40+Math.random()*600,y:48+Math.random()*164,w:item.food?56:38,h:item.food?44:48,phase:Math.random()*6.28})}},450)});
background.onload=paint;egret.forEach(image=>image.onload=paint);objects.forEach(item=>item.image.onload=paint);
</script></body></html>
